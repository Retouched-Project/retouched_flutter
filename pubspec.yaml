name: retouched
description: "A recreation of Nitrome Touchy with Flutter."
publish_to: 'none'

version: 1.0.4

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  flutter_svg: ^2.2.1
  device_info_plus: 12.3.0
  ffi: ^2.1.0
  msgpack_dart: ^1.0.1
  xml: ^6.5.0
  sensors_plus: ^7.0.0
  vibration: ^3.0.0
  protobuf: ^6.0.0
  logging: ^1.3.0
  path_provider: ^2.1.6
  hooks: ^2.0.2
  code_assets: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  ffigen: ^20.1.1
  yaml: ^3.1.3

hooks:
  user_defines:
    retouched:
      # A bronze-monkey checkout with the library built for each target under
      # target/<rust triple>/<profile>/.
      bronze_monkey_dir: ..
      bronze_monkey_profile: release

flutter:
  uses-material-design: true
  assets:
    - assets/retouched_logo.svg
    - assets/retouched_logo_outline.svg
    - assets/retouched_logo_text.svg
    - assets/slotwifi.svg
    - assets/unlock_slider_bg.svg
    - assets/unlock_slider.svg
    - assets/retouched_logo_text_flutter.svg
    - assets/menu_disconnect.svg
    - assets/menu_help.svg
    - assets/menu_music.svg
    - assets/menu_music_off.svg
    - assets/menu_quit.svg
    - assets/menu_reset.svg
    - assets/menu_sound_on.svg
    - assets/menu_sound_off.svg
    - assets/checkmark.svg
    - assets/cross.svg
    - assets/host.svg
    - assets/server.svg
    - assets/wait.svg
    - assets/dpad/
    - assets/nav/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
